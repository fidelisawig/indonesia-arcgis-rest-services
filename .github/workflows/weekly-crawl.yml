name: Weekly ArcGIS REST Services Status & Deep Crawl

on:
  workflow_dispatch:

  schedule:
    # Runs automatically once every week (Every Sunday at 00:00 UTC)
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  check-and-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Unified Check & Crawl Script
        run: |
          python scripts/crawl_services.py

      - name: Commit updated status report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Weekly Update: ArcGIS REST services status report"
          push_options: '--force'
          skip_dirty_check: false
          internal_git_options: '-c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com"'
